<head>

  <title>访问验证｜我的心动方向地图</title>
  <style>
    :root{--ink:#3e3144;--muted:#827486;--purple:#8e4f9f;--purple2:#6e357e;--line:#ead8ee;--rose:#fff7fb}
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 5%,#fff 0 13%,transparent 36%),linear-gradient(145deg,#faeafa 0%,#eadcf7 52%,#d9d0f0 100%);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}
    .card{width:min(100%,430px);padding:34px 26px 28px;border:1px solid rgba(255,255,255,.85);border-radius:30px;background:rgba(255,255,255,.82);box-shadow:0 22px 70px rgba(93,54,111,.17);backdrop-filter:blur(16px)}
    .brand{font-size:13px;font-weight:800;letter-spacing:.16em;color:#7c418c}
    .mark{display:grid;place-items:center;width:76px;height:76px;margin:34px auto 24px;border-radius:50%;background:linear-gradient(145deg,#f6dcf2,#decdf2);box-shadow:inset 0 0 0 1px #fff,0 12px 34px rgba(126,70,145,.2);font-size:37px;color:#fff}
    h1{margin:0;text-align:center;font-size:28px;letter-spacing:.02em}
    .desc{margin:14px auto 26px;max-width:320px;text-align:center;color:var(--muted);font-size:15px;line-height:1.7}
    label{display:block;margin:0 0 9px;font-size:14px;font-weight:700}
    input{width:100%;height:52px;padding:0 16px;border:1.5px solid var(--line);border-radius:15px;background:#fff;color:var(--ink);font:inherit;font-size:17px;outline:none;transition:.2s}
    input:focus{border-color:#b377bd;box-shadow:0 0 0 4px rgba(168,103,181,.13)}
    button{width:100%;height:52px;margin-top:14px;border:0;border-radius:15px;background:linear-gradient(135deg,var(--purple),var(--purple2));color:#fff;font:inherit;font-size:16px;font-weight:800;letter-spacing:.08em;cursor:pointer;box-shadow:0 12px 25px rgba(111,53,126,.22)}
    button:disabled{opacity:.65;cursor:wait}
    .error{min-height:22px;margin:11px 2px 0;color:#b23b62;font-size:13px;text-align:center}
    .note{margin:20px 0 0;color:#9a8e9d;font-size:12px;line-height:1.6;text-align:center}
  </style>
</head>

    const fromBase64 = value => Uint8Array.from(atob(value), c => c.charCodeAt(0));
    const form = document.getElementById("gate");
    const input = document.getElementById("password");
    const button = document.getElementById("unlock");
    const error = document.getElementById("error");

    form.addEventListener("submit", async event => {
      event.preventDefault();
      error.textContent = "";
      button.disabled = true;
      button.textContent = "正在验证…";
      try {
        const material = await crypto.subtle.importKey(
          "raw", new TextEncoder().encode(input.value), "PBKDF2", false, ["deriveKey"]

        const key = await crypto.subtle.deriveKey(
          {name:"PBKDF2", salt:fromBase64(payload.salt), iterations:payload.iterations, hash:"SHA-256"},
          material,
          {name:"AES-GCM", length:256},
          false,
          ["decrypt"]
        );
        const plain = await crypto.subtle.decrypt(
          {name:"AES-GCM", iv:fromBase64(payload.iv)}, key, fromBase64(payload.data)
        );
        const html = new TextDecoder().decode(plain);
        document.open();
        document.write(html);
        document.close();

        error.textContent = "密码不正确，请重新输入。";
        input.select();
        button.disabled = false;
        button.textContent = "进入测试";
